name: verify-github-structured-interaction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-structured-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Recovery/admission source conformance checks immutable owner ancestry.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-github-v414.txt
      - run: python scripts/test_github_structured_interaction.py
      - run: node scripts/test_v414_schema_portability.cjs
      - run: python tests/test_v415_report.py
      - run: python tests/test_v415_consumer.py
      - run: python tests/test_v415_contract_integration.py
      - run: python tests/test_v415_source_boundary.py
      - run: python scripts/test_v415_github_recovery.py
      - run: python scripts/test_v415_artifact_acceptance.py
      - run: python scripts/test_v415_bounded_source_repair.py
