name: v411-exact-owner-oracles

on:
  push:
    branches:
      - validation/v411-exact-owner-oracles-20261012

permissions:
  contents: read

jobs:
  t13-exact:
    name: T13 exact-HEAD owner focused and T01/T02 regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact T13 owner subject
        uses: actions/checkout@v4
        with:
          ref: 1c3796921cbbe6c000241d0a5c0608b26e604e2d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable T13 subject and clean worktree
        run: |
          test "$(git rev-parse HEAD)" = "1c3796921cbbe6c000241d0a5c0608b26e604e2d"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          git rev-parse HEAD:standards/DEVELOPMENT_WORKFLOW.md
          git rev-parse HEAD:standards/TASK_DECOMPOSITION_STANDARD.md
          git rev-parse HEAD:scripts/test_v411_t13_role_conduct.py
      - name: Run T13 full focused suite (no skips suppressed)
        run: python scripts/test_v411_t13_role_conduct.py
      - name: Run T01/T02 regressions
        run: |
          python scripts/test_v411_t01_effective_rules.py
          python scripts/test_v411_t02_risk_intake.py
      - name: Run frozen T13 Pack exact required gate and repair regressions
        run: |
          python scripts/test_v49_gate_currentness.py
          python scripts/test_v410_t04a_gate_repair_routing.py
          python scripts/test_v49_conformance_suite.py

  t07-exact:
    name: T07 exact-HEAD R2 focused and Execution regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact T07 R2 subject
        uses: actions/checkout@v4
        with:
          ref: 6f0392d837ab7fe9d7e8a84a108d9f0cfe6e1fb4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable T07 subject and clean worktree
        run: |
          test "$(git rev-parse HEAD)" = "6f0392d837ab7fe9d7e8a84a108d9f0cfe6e1fb4"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          git rev-parse HEAD:standards/EXECUTION_ARCHITECTURE_STANDARD.md
          git rev-parse HEAD:scripts/test_v411_merge_admission.py
      - name: Run T07 full R2 focused suite (no skips suppressed)
        run: python scripts/test_v411_merge_admission.py
      - name: Run Execution regressions
        run: |
          python scripts/test_execution_architecture.py
          python scripts/test_v48_execution_ownership.py
          python scripts/test_v410_t06b_multi_dispatch_conformance.py

  t07-adversarial-integrity:
    name: T07 R2 scope guard committed-tamper negative oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f0392d837ab7fe9d7e8a84a108d9f0cfe6e1fb4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove reviewed HEAD and original test green
        run: |
          test "$(git rev-parse HEAD)" = "6f0392d837ab7fe9d7e8a84a108d9f0cfe6e1fb4"
          python -m unittest scripts.test_v411_merge_admission.Section14PlacementTests.test_owner_write_set_is_exactly_two_paths_and_tree_clean
      - name: Inject committed unauthorized edit outside section 14
        run: |
          printf '\n<!-- ADVERSARIAL_UNAUTHORIZED_T07_OWNER_EDIT_OUTSIDE_SECTION14 -->\n' >> standards/EXECUTION_ARCHITECTURE_STANDARD.md
          git -c user.name='Validation Oracle' -c user.email='validation@example.invalid' add standards/EXECUTION_ARCHITECTURE_STANDARD.md
          git -c user.name='Validation Oracle' -c user.email='validation@example.invalid' commit -m 'negative: tamper outside T07 section14'
          test -z "$(git status --porcelain)"
      - name: Negative oracle must reject committed EA tamper
        run: |
          if python -m unittest scripts.test_v411_merge_admission.Section14PlacementTests.test_owner_write_set_is_exactly_two_paths_and_tree_clean; then
            echo "FAIL_CLOSED_BREACH: committed out-of-scope EA edit passed R2 owner-guard"
            exit 1
          else
            echo "EXPECTED_REJECTION: committed out-of-scope EA edit rejected"
          fi

  t13-adversarial-owner-scope:
    name: T13 committed out-of-owner-section tamper negative oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c3796921cbbe6c000241d0a5c0608b26e604e2d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact T13 candidate and clean base
        run: |
          test "$(git rev-parse HEAD)" = "1c3796921cbbe6c000241d0a5c0608b26e604e2d"
          test -z "$(git status --porcelain)"
          python scripts/test_v411_t13_role_conduct.py
      - name: Introduce clean committed unauthorized TDS change outside T13 section
        run: |
          printf '\n<!-- V411_T13_NEGATIVE_UNAUTHORIZED_TDS_OUTSIDE_ROLE_SECTION -->\n' >> standards/TASK_DECOMPOSITION_STANDARD.md
          git -c user.name='Scope Falsifier' -c user.email='scope@example.invalid' add standards/TASK_DECOMPOSITION_STANDARD.md
          git -c user.name='Scope Falsifier' -c user.email='scope@example.invalid' commit -m 'negative: unauthorized T13 TDS unrelated prose change'
          test -z "$(git status --porcelain)"
      - name: Owner protection must reject committed unauthorized TDS delta
        run: |
          if python scripts/test_v411_t13_role_conduct.py; then
            echo "FAIL_CLOSED_BREACH: T13 focused suite admitted a committed unauthorized TDS alteration"
            exit 1
          else
            echo "EXPECTED_REJECTION: T13 owner focused suite rejected an unauthorized TDS edit"
          fi


  t08-exact:
    name: T08 exact-HEAD human authority focused and predecessor regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd0f8ccfdf835edd8472e7ab5e7f83cfed6df25d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind immutable T08 subject and clean worktree
        run: |
          test "$(git rev-parse HEAD)" = "dd0f8ccfdf835edd8472e7ab5e7f83cfed6df25d"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          git rev-parse HEAD:standards/DEVELOPMENT_WORKFLOW.md
          git rev-parse HEAD:scripts/test_v411_t08_human_denial_authority.py
      - name: Run T08 focused suite
        run: python scripts/test_v411_t08_human_denial_authority.py
      - name: Run T01 and T02 Workflow predecessor regressions
        run: |
          python scripts/test_v411_t01_effective_rules.py
          python scripts/test_v411_t02_risk_intake.py
      - name: Run reusable T13 semantic suite excluding historical full-file owner identity
        run: |
          python - <<'PY'
          import unittest
          import scripts.test_v411_t13_role_conduct as m

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          all_tests = list(flatten(unittest.defaultTestLoader.loadTestsFromModule(m)))
          historical = "scripts.test_v411_t13_role_conduct.RoleConductSectionPlacementTests.test_complete_owner_standards_match_reviewed_qualified_source"
          selected = [t for t in all_tests if t.id() != historical]
          omitted = [t for t in all_tests if t.id() == historical]
          assert len(omitted) == 1, [t.id() for t in omitted]
          result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(selected))
          print(f"T13_REUSABLE_INTEGRATED={result.testsRun}")
          assert result.wasSuccessful()
          identity_result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(omitted))
          assert not identity_result.wasSuccessful(), "historical T13 full-file identity unexpectedly accepted authorized T08 successor"
          print("T13_HISTORICAL_OWNER_IDENTITY=EXPECTED_NOT_APPLICABLE_ON_AUTHORIZED_T08_SUCCESSOR")
          PY

  t08-adversarial-prior-owner-tamper:
    name: T08 rejects committed tamper of predecessor-owned Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd0f8ccfdf835edd8472e7ab5e7f83cfed6df25d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove T08 candidate green
        run: python scripts/test_v411_t08_human_denial_authority.py
      - name: Commit unauthorized edit inside predecessor-owned Workflow prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("standards/DEVELOPMENT_WORKFLOW.md")
          s=p.read_text(encoding="utf-8")
          marker="## 5. Blocker Propagation"
          assert marker in s
          s=s.replace(marker, "<!-- T08_NEGATIVE_UNAUTHORIZED_PREDECESSOR_TAMPER -->\n\n"+marker, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git -c user.name='T08 Scope Falsifier' -c user.email='scope@example.invalid' add standards/DEVELOPMENT_WORKFLOW.md
          git -c user.name='T08 Scope Falsifier' -c user.email='scope@example.invalid' commit -m 'negative: unauthorized predecessor Workflow edit'
          test -z "$(git status --porcelain)"
      - name: Focused owner boundary must reject committed predecessor tamper
        run: |
          if python scripts/test_v411_t08_human_denial_authority.py; then
            echo "FAIL_CLOSED_BREACH: committed predecessor-owned Workflow tamper passed T08 owner guard"
            exit 1
          else
            echo "EXPECTED_REJECTION: committed predecessor-owned Workflow tamper rejected"
          fi
