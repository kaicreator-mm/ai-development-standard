name: v411-fresh-reviewer-copilot-dispatch

on:
  push:
    branches:
      - validation/v411-exact-owner-oracles-20261012

permissions:
  contents: read
  pull-requests: write

jobs:
  request-external-independent-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 1070
            expected_head: 0762c939e32f5b37037c1de6606484b48bc9449c
          - pr: 1071
            expected_head: 319e5c27e528732cdefe361a6255174d849f999a
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify PR source exact currentness before external reviewer request
        shell: bash
        run: |
          actual="$(gh api repos/kaicreator-mm/ai-development-standard/pulls/${{ matrix.pr }} --jq '.head.sha')"
          test "$actual" = "${{ matrix.expected_head }}"
      - name: Request Copilot via GraphQL botLogins (no source mutation)
        shell: bash
        run: |
          gh api graphql \
            -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { id number headRefOid } } }' \
            -f owner=kaicreator-mm -f repo=ai-development-standard -F number=${{ matrix.pr }} > /tmp/pr-node.json
          node_id="$(jq -er '.data.repository.pullRequest.id' /tmp/pr-node.json)"
          head="$(jq -er '.data.repository.pullRequest.headRefOid' /tmp/pr-node.json)"
          test "$head" = "${{ matrix.expected_head }}"
          gh api graphql \
            -f query='mutation($id:ID!) { requestReviewsByLogin(input:{pullRequestId:$id,botLogins:["copilot-pull-request-reviewer"]}) { pullRequest { number } } }' \
            -f id="$node_id" > /tmp/copilot-request.json
          jq -e --argjson number '${{ matrix.pr }}' '.data.requestReviewsByLogin.pullRequest.number == $number' /tmp/copilot-request.json
      - name: Readback trigger event without treating request as review PASS
        shell: bash
        run: |
          gh api repos/kaicreator-mm/ai-development-standard/issues/${{ matrix.pr }}/events --paginate \
            --jq '[.[] | select(.event == "copilot_work_started")] | length' || true
          echo "GraphQL reviewer request was attempted. Only actual subsequent independent reviewed exact HEAD plus findings can fulfill the native Fresh Review gate."
