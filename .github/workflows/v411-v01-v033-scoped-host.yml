# Branch-local validation only; never merge this workflow into version/main.
# Workflow runs at its own branch commit but checks out EXACT candidate below.
name: v411 V01 v033 exact-candidate scoped source-host witness
on:
  push:
    branches:
      - validation/v411-v01-v033-host-214f6a97
permissions:
  contents: read
jobs:
  current-candidate-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact integrated candidate, not workflow commit
        uses: actions/checkout@v4
        with:
          ref: 214f6a97b1eed948e1afef8f5089eb4bf4b97d26
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact SHA tree clean worktree and platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "214f6a97b1eed948e1afef8f5089eb4bf4b97d26"
          test "$(git rev-parse HEAD^{tree})" = "51355178551b300b916355d4b952cd0fbdd919fe"
          test -z "$(git status --porcelain)"
          echo "V411_V01_V033_TESTED_SHA=$(git rev-parse HEAD)"
          echo "V411_V01_V033_TESTED_TREE=$(git rev-parse HEAD^{tree})"
          uname -a
          python --version
      - name: Standards manifest and documents
        run: python -B scripts/verify_standard.py
      - name: Bounded covered X reference (T01)
        run: python -B scripts/test_v411_t01_effective_rules.py
      - name: Untrusted transport/reference semantics (T10)
        run: python -B scripts/test_v411_t10_untrusted_inputs.py
      - name: Synthetic only SQLite S08 six tests
        run: python -B scripts/test_v411_s08_prospective_mechanism.py
      - name: Actual T12 model assertions diagnostic without historical task-head guard
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import collections, importlib.util, json, subprocess
          from pathlib import Path
          expected = "214f6a97b1eed948e1afef8f5089eb4bf4b97d26"
          sha = subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree = subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          assert sha == expected
          assert tree == "51355178551b300b916355d4b952cd0fbdd919fe"
          spec = importlib.util.spec_from_file_location("v411_t12_model", Path("scripts/test_v411_t12_abc_conformance.py"))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          registry = mod.load_registry()
          problems = mod.validate_registry(registry)
          if problems:
              print("T12_REGISTRY_FAIL",json.dumps(problems))
              raise SystemExit(1)
          records = [
              mod.run_record(registry["scenarios"][cid][p],sha,tree)
              for cid in sorted(mod.EXPECTED_IDS) for p in ("positive","negative")
          ]
          compound = mod.run_compound(registry["compound"],sha,tree)
          counts = collections.Counter(r["gate_disposition"] for r in records)
          assert len(records)==52
          assert all(r["exit"]==0 for r in records)
          assert compound["contract_coverage_oracle"]=="PASS"
          print("V411_V033_T12_SEMANTIC_ONLY_"+json.dumps({
              "sha":sha,"tree":tree,"records":len(records),
              "owner_assertion_failure":0,"gate_dispositions":dict(counts),
              "compound_coverage":compound["contract_coverage_oracle"],
              "material_truth":compound["material_disposition"],
              "physical_fourway":"NOT_CERTIFIED",
              "method":"run_record_and_run_compound_without_authoring_head_guard"
          },sort_keys=True))
          PY
      - name: Preserve ORIGINAL T12 guarded test raw exit as known failure (not a Gate PASS)
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -B scripts/test_v411_t12_abc_conformance.py > /tmp/t12-guarded-original.log 2>&1
          rc=$?
          set -e
          cat /tmp/t12-guarded-original.log
          echo "V411_V033_T12_ORIGINAL_RAW_EXIT=$rc"
          echo "V411_V033_T12_ORIGINAL_STATUS=FAIL_IF_EXIT_NONZERO__NOT_RECLASSIFIED"
          # Sanity sentinel: unexpected changed behavior must stop the diagnostic.
          test "$rc" -eq 1
      - name: Assert no tracked or untracked source modifications
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "214f6a97b1eed948e1afef8f5089eb4bf4b97d26"
          test "$(git rev-parse HEAD^{tree})" = "51355178551b300b916355d4b952cd0fbdd919fe"
          test -z "$(git status --porcelain)"
          echo "V411_V033_SCOPED_HOST_COMPLETE=YES__NOT_VERSION_GATE_OR_RELEASE_PASS"
