name: v411-v01-exact-focused-20261015
on:
  push:
    branches:
      - validation/v411-v01-aac1e-targeted
permissions:
  contents: read
jobs:
  v01-exact-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout exact integrated v4.11 candidate (NOT workflow commit)
        shell: bash
        run: |
          git checkout --force --detach aac1e1206e4033601616c295e768e51fbc16efb1
          test "$(git rev-parse HEAD)" = aac1e1206e4033601616c295e768e51fbc16efb1
          echo "V411_V01_EXACT_TESTED_SHA=$(git rev-parse HEAD)"
          echo "V411_V01_EXACT_TESTED_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: I1122 declared operator and affected T05 source tests
        run: |
          python -B scripts/test_v411_i1122_self_declared_executor.py
          python -B scripts/test_v411_t05_event_authority.py
      - name: Standard scoped reference models and manual helper
        run: |
          python -B scripts/test_v411_t01_effective_rules.py
          python -B scripts/test_v411_t10_untrusted_inputs.py
          python -B scripts/test_v411_s08_prospective_mechanism.py
          python -B scripts/test_v49_manual_reference_flow.py
      - name: Current T12 52 reference cases and four-way disclosure (without old authoring guard)
        shell: bash
        run: |
          python -B - <<'PY'
          import sys, json, collections, subprocess
          sys.path.insert(0, "scripts")
          import test_v411_t12_abc_conformance as t
          sha = subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree = subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          doc=t.load_registry()
          failures=[]
          counts=collections.Counter()
          records=[]
          for cid in sorted(doc["scenarios"]):
              for polarity in ("positive","negative"):
                  rec=t.run_record(doc["scenarios"][cid][polarity],sha,tree)
                  records.append(rec)
                  counts[rec["gate_disposition"]]+=1
                  if rec["exit"]!=0:
                      failures.append({"case":cid,"polarity":polarity,"result":rec["result"],"owner_tests":rec["owner_test_results"]})
          compound=t.run_compound(doc["compound"],sha,tree)
          result={"tested_sha":sha,"tested_tree":tree,"records":len(records),"gate_dispositions":dict(counts),"owner_assertion_failures":len(failures),"failures":failures[:3],"compound":compound["material_disposition"],"physical_fourway":"NOT_CERTIFIED","real_human_deny":"NOT_PROVEN","kind":"STANDARDS_CONTRACT_ORACLE_ONLY"}
          print("V411_V01_EXACT_FOCUSED_T12_SEMANTIC="+json.dumps(result,sort_keys=True,default=str))
          assert len(records)==52, "regression: expected 52 S/X polarity records"
          assert not failures, "regression: owning reference assertions failed"
          assert compound["material_disposition"]=="MATERIAL_INTERSECTION_UNKNOWN"
          PY
      - name: Preserve T12 original guarded raw result without pretending PASS
        shell: bash
        run: |
          set +e
          python -B scripts/test_v411_t12_abc_conformance.py > /tmp/v411-v01-t12-guarded.log 2>&1
          rc=$?
          set -e
          tail -n 26 /tmp/v411-v01-t12-guarded.log
          echo "V411_V01_EXACT_T12_GUARDED_RAW_EXIT=$rc"
          echo "V411_V01_EXACT_T12_GUARDED_RAW_STATE=$(test "$rc" -eq 0 && echo PASS || echo FAIL)"
          test "$rc" -eq 1
