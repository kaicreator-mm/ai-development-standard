name: v411-readback-fresh-reviewer-status

on:
  push:
    branches:
      - validation/v411-exact-owner-oracles-20261012

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-reviewer-status:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: [1070, 1071]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect GitHub GraphQL bot review requests and real submitted reviews
        shell: bash
        run: |
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$n:Int!) { repository(owner:$owner,name:$repo) { pullRequest(number:$n) { number headRefOid reviewRequests(first:20) { nodes { requestedReviewer { __typename ... on Bot { login } ... on User { login } } } } reviews(last:20) { nodes { state author { login } commit { oid } } } } } }' \
            -f owner=kaicreator-mm -f repo=ai-development-standard -F n=${{ matrix.pr }} \
            --jq '.data.repository.pullRequest | {number,headRefOid,requestedReviewers:[.reviewRequests.nodes[].requestedReviewer],actualReviews:[.reviews.nodes[]|{state,author,commit}]}'
      - name: Inspect Copilot work-started events (no PASS inference)
        shell: bash
        run: |
          gh api repos/kaicreator-mm/ai-development-standard/issues/${{ matrix.pr }}/events --paginate \
            --jq '[.[] | select(.event == "copilot_work_started" or .event == "review_requested") | {id,event,actor:.actor.login}]'
          echo 'Absent Copilot events/reviews means dispatch remains UNCONFIRMED, not PASS.'
