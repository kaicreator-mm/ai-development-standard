name: verify-standard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_standard.py
      - run: python scripts/test_verify_standard.py
      - run: python scripts/test_verify_project_standard.py
      - run: python scripts/test_project_execution_profile.py
      - run: python scripts/test_protocol_schemas.py
      - run: python scripts/test_v33_lifecycle_contracts.py
      - run: python scripts/test_execution_architecture.py
      - run: python scripts/verify_runner_capability_reference.py
