name: verify-standard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The execution-core regression suite reads pinned historical Git objects.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_standard.py
      - run: python scripts/test_verify_standard.py
      - run: python scripts/test_verify_project_standard.py
      - run: python scripts/test_project_execution_profile.py
      - run: python scripts/test_protocol_schemas.py
      - run: python scripts/test_v33_lifecycle_contracts.py
      - run: python scripts/test_v33_semantic_regressions.py
      - run: python scripts/test_v34_lifecycle_contracts.py
      - run: python scripts/test_v34_review_repairs.py
      - run: python scripts/test_v40_operation_contracts.py
      - run: python scripts/test_v40_adoption_migration.py
      - run: python scripts/test_v40_final_hardening.py
      - run: python scripts/test_v40_dogfood_hardening.py
      - run: python scripts/test_v40_r2_machine_hardening.py
      - run: python scripts/test_v40_r3_carryforward.py
      - run: python scripts/test_v40_t010_successor_hardening.py
      - run: python scripts/test_v40_t010_canonical_surface.py
      - run: python scripts/test_v40_t012_pre_release_hardening.py
      - run: python scripts/test_v40_reference_flows.py
      - run: python scripts/test_pointer_only_trigger_contract.py
      - run: python scripts/test_work_item_contract_and_golden_templates.py
      - run: python scripts/test_task_dag_lane_parallelism.py
      - run: python scripts/verify_event_writer_surfaces.py
      - run: python scripts/test_execution_architecture.py
      - run: python scripts/verify_runner_capability_reference.py
      - run: python scripts/test_v43_conformance_dogfood.py
      - run: python scripts/test_v49_execution_core.py
      - run: python scripts/test_v49_authority_state_registry.py
      - run: python scripts/test_v49_role_execution_profile.py
      - run: python scripts/test_v49_task_learning_v2.py
      - run: python scripts/test_v49_gate_currentness.py
      - run: python scripts/test_v49_execution_contract_refs.py
      - run: python scripts/test_v49_jit_dag_governance.py
      - run: python scripts/test_v49_assurance_plan_v2.py
      - run: python scripts/test_v49_assurance_owner.py
      - run: python scripts/test_v49_release_applicability.py
      - run: python scripts/test_v49_conformance_suite.py
