name: v411-independent-model-probe
on:
  push:
    branches:
      - validation/v411-exact-owner-oracles-20261012
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe isolated GitHub Models inference without source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          endpoint="https://models.github.ai/inference/chat/completions"
          payload={"model":"openai/gpt-4.1-mini","messages":[{"role":"system","content":"You are a separate read-only code reviewer. Do not state PASS without evidence."},{"role":"user","content":"Reply with the exact word REVIEWER_READY and no other text."}],"max_tokens":40}
          req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json","Accept":"application/vnd.github+json"},method="POST")
          try:
            with urllib.request.urlopen(req,timeout=45) as response:
              result=json.load(response)
              output=result["choices"][0]["message"]["content"].strip()
              print("MODEL_PROBE_HTTP="+str(response.status))
              print("MODEL_PROBE_RESPONSE="+output[:120])
              assert output=="REVIEWER_READY","unexpected response"
          except urllib.error.HTTPError as e:
            print("MODEL_PROBE_HTTP="+str(e.code))
            print("MODEL_PROBE_ERROR="+e.read().decode()[:700])
            raise
          PY
