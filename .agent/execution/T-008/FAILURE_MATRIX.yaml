task_id: "T08"
failures:
  - id: "PACK_OR_BASE_DRIFT"
    trigger: "branch/target/base/Task Pack/L3/dependency identity differs from the bound pack facts"
    action: "BLOCK; do not silently rebase or rewrite base_sha; route CONTROLLER_REBIND_REQUIRED"
  - id: "WRITE_SET_ESCAPE"
    trigger: "implementation requires a repository path outside docs/implementation/4.7.0/dogfood/** or scripts/test_v47_fresh_agent_dogfood.py"
    action: "BLOCK; report planning/authority gap; do not widen T08"
  - id: "HIDDEN_CONTEXT_DEPENDENCY"
    trigger: "successful dogfood reconstruction requires prior chat/session-only information"
    action: "FAIL scenario; persist the missing durable authority gap rather than using hidden context"
  - id: "STATIC_PROMOTED_TO_REAL"
    trigger: "fixture/mock/reconstruction/unit/static evidence is used to claim a fresh Agent/session or external runtime actually executed"
    action: "FAIL evidence fidelity; REAL remains NOT_RUN/BLOCKED"
  - id: "REAL_RUNTIME_UNAVAILABLE"
    trigger: "Frozen REAL fresh-session acceptance is material but Builder environment cannot execute it"
    action: "implement only in-scope support; create durable exact-subject Validation handoff after immutable Builder HEAD exists; preserve REAL=NOT_RUN/BLOCKED"
  - id: "TRANSPORT_IDENTITY_AS_INDEPENDENCE"
    trigger: "same/different user, account, provider, credential, or transport is used by itself as independence proof"
    action: "FAIL independence claim; require logical fresh-session evidence"
  - id: "OWNER_REDEFINITION"
    trigger: "T08 attempts to rewrite T05 read-routing, T07 conformance, Product/L2, registry, Gate/lifecycle, or another semantic owner"
    action: "BLOCK as authority contradiction/planning gap"
  - id: "EXACT_SUBJECT_MISMATCH"
    trigger: "Validation or Review evidence is for a different HEAD/tree, materially different target/base, or changed Task/pack identity"
    action: "evidence does not transfer; request successor exact-subject gate"
  - id: "REVIEW_BEFORE_VALIDATION_OR_REUSED_REVIEW"
    trigger: "Fresh Review starts before exact-subject Validation PASS, is performed by Builder/Validator, or reuses an old review context"
    action: "Review is not admissible; create a genuinely new READ-ONLY Fresh Review only after Validation PASS"
  - id: "PRIVATE_COT_REQUIREMENT"
    trigger: "dogfood requires capture/disclosure of private chain-of-thought"
    action: "FAIL design; replace with observable inputs, outputs, traces, identities and evidence classifications"
  - id: "CLOSURE_OR_RELEASE_INFERENCE"
    trigger: "T08/CI/Validation/Review evidence is promoted to Version Closure, Release Qualification, Release PASS, or merge authority"
    action: "reject inference; those authorities remain outside T08"
