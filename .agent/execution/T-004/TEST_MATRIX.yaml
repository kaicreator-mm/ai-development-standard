task_id: T-004
scope: concern
validation_owner: independent-from-builder
required:
  - id: material_closeout_reference_path
    oracle: applicable templates can record durable material Task Learning reference(s) without copying evidence bodies
  - id: none_material_fast_path
    oracle: literal TASK_LEARNING=NONE_MATERIAL is explicit and does not require an empty task-learning object
  - id: stale_learning_fails_closed
    oracle: stale/ambiguous/non-current learning remains historical and is not silently rebound as current behavioral proof
  - id: authority_separation
    oracle: Task Learning does not replace Product/Architecture/Task/ADR/Incident/Review/Validation/merge/release authority
  - id: privacy_boundary
    oracle: no private chain-of-thought, hidden evaluator content, credentials, secrets, or verbose scratch reasoning is requested
  - id: execution_architecture_boundary
    oracle: Execution Pack template wiring adds closeout refs/checks only and does not redefine T-002 currentness/admission/scheduling/resource semantics
  - id: exact_write_set
    oracle: implementation candidate delta is exactly the seven paths declared in MANIFEST.yaml
regression:
  - existing Task/Issue/PR/final-closeout template Gate vocabularies remain compatible
  - Task Learning v1 focused contract remains green without schema/reference edits
  - pointer-only dispatch/currentness contract remains green
commands:
  - python -B scripts/test_work_item_contract_and_golden_templates.py
  - python -B scripts/test_v48_task_learning.py
  - python -B scripts/test_pointer_only_trigger_contract.py
  - python -B scripts/verify_standard.py
builder_evidence:
  - exact candidate SHA and tree
  - exact seven-file changed-path list
  - command results bound to candidate where executed
  - own closeout outcome: TASK_LEARNING=NONE_MATERIAL or durable Task Learning ref(s)
independent_validation:
  - rerun applicable commands on exact candidate
  - inspect all required static oracles on exact candidate
  - publish PASS/FAIL/BLOCKED without reusing Builder self-evidence as independent truth
