task_id: T-004
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: v4.8 owner surface (capability/eligibility/Claim) is missing or its ref cannot resolve at the candidate
    disposition: BLOCKED_LINEAGE
    action: stop and report; never fabricate or inline-copy owner inventories
  - condition: schema would need to encode authority-granting semantics (role actions, terminal authority, capability proof)
    disposition: OWNER_BOUNDARY_VIOLATION
    action: stop; those semantics belong to external owners
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set (incl. read-only owner refs)
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: required evidence unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
