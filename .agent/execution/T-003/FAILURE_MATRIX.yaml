task_id: T-003
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: a v1 registry schema cannot represent a Frozen v4.9 requirement
    disposition: SCHEMA_INSUFFICIENT
    action: stop and route for architecture/rebind — do NOT widen T003 scope or mutate read-only schema inputs
  - condition: duplicate/ambiguous canonical owner entry would be required by v4.9 semantics
    disposition: REGISTRY_AMBIGUITY
    action: block admission and route to registry owner — never last-writer-wins
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set (including read-only schema inputs)
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: registry changes would imply automatic mutation of semantic owners, workflow state, or ADS authority
    disposition: GOVERNANCE_VIOLATION
    action: stop; registry metadata is descriptive and authority-free
  - condition: inherited registry surfaces or F01–F10 negatives would be weakened or removed
    disposition: REGRESSION
    action: stop; inherited surfaces are immutable baseline
  - condition: required evidence unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
