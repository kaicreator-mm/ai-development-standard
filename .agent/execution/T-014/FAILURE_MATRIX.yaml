task_id: T-014
failure_modes:
  - condition: version/v4.8.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: an integrated oracle fails (owner duplication, eligibility/ranking violation, atomicity breach, Fast Path/compat regression, three-family count mismatch)
    disposition: INTEGRATION_DEFECT
    action: record the failing oracle with exact refs in closure inputs; route the defect to the owning Task; do NOT repair owner semantics in this lane
  - condition: a pinned regression command fails or cannot run on this host
    disposition: REGRESSION_GAP
    action: record exact command, exit/error and reason as NOT_RUN|BLOCKED in INTEGRATED_REGRESSION_EVIDENCE.json; never substitute CI history for local truth
  - condition: closure inputs would need to declare Version Closure / Release Qualification / integration verdicts
    disposition: AUTHORITY_OVERFLOW
    action: stop; closure inputs are inputs only — the verdict belongs to later closure gates
  - condition: evidence for an acceptance claim is unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: economic-savings or universal-routing policy would be inferred without comparable measured evidence
    disposition: OVERCLAIM
    action: preserve NOT_MEASURED posture and record in closure inputs
