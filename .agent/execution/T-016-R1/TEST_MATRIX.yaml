    input: git:owner/repo@main
    oracle: reject_or_fail_closed
  - id: mutable-named-branch
    input: git:owner/repo@feature/x
    oracle: reject_or_fail_closed
  - id: tag-or-ref-alias
    input: git:owner/repo@v4.8.0
    oracle: reject_or_fail_closed
  - id: repository-only
    input: git:owner/repo
    oracle: reject_or_fail_closed
  - id: short-sha
    input: git:owner/repo@abcdef0
    oracle: reject_or_fail_closed
  - id: malformed-or-nonhex
    input: git:owner/repo@zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
    oracle: reject_or_fail_closed
  - id: equal-mutable-alias-drift
    oracle: textual equality of a mutable alias across two different underlying commits must not imply current applicability
