task: T-016-R1
source_finding: "#593 P1"
positive:
  - id: immutable-exact-subject
    oracle: canonical git owner/repository plus 40-lowercase-hex commit subject validates and remains exact-subject evidence only
  - id: predecessor-evidence-semantics
    oracle: POSITIVE/NEGATIVE/MIXED, owner refs, bounded evidence strength and economic non-inference remain supported
negative:
