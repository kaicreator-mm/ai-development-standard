task_id: T-015
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: downstream mechanism cannot be exercised (real external/downstream inability)
    disposition: BLOCKED_NOT_RUN
    action: record BLOCKED/NOT_RUN truthfully with the exact missing capability — never guessed PASS
  - condition: a qualifying downstream contract is not met
    disposition: GENERALITY_NOT_SATISFIED
    action: record NOT_SATISFIED truthfully in the handoff — bounded claim only
  - condition: a stale predecessor/evidence binding would be laundered into current
    disposition: STALE_BINDING
    action: stop; bind exact and current only
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: handoff would issue closure/RQ verdicts or conversion of NOT_RUN/BLOCKED into PASS
    disposition: AUTHORITY_OVERFLOW
    action: stop; handoff is inputs only
