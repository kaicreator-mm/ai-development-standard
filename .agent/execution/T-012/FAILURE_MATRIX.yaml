task_id: T-012
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: a conformance scenario would require redefining owner semantics to make it pass
    disposition: OWNER_DEFECT
    action: report the defect with exact refs and route to the owning Task — never repair owner files in this lane
  - condition: the F1/F2 re-binds would need assertion-logic changes beyond pin constants
    disposition: ORACLE_WEAKENING
    action: stop and request Controller rebind/amendment
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: required evidence unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
