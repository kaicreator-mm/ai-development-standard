fail_closed:
  - condition: "version/v4.6.0 no longer equals bound base SHA/tree"
    classification: "PACK_STALE_MATERIAL"
    action: "STOP/CONTROLLER_REBIND_REQUIRED"
  - condition: "Task Pack or L3 identity differs from bound blob"
    classification: "EXECUTION_PACK_INVALID"
    action: "STOP/CONTROLLER_REBIND_REQUIRED"
  - condition: "#311 gains an unresolved blocker or dependency completion identity changes"
    classification: "PACK_STALE_MATERIAL"
    action: "STOP/CONTROLLER_REBIND_REQUIRED"
  - condition: "Builder needs a path outside the authorized implementation write-set"
    classification: "TASK_PACK_DEFECT_OR_AUTHORITY_GAP"
    action: "STOP and route to Task/Controller authority; do not write"
  - condition: "implementation requires Product/L2/Task authority rewrite or new owner/lifecycle semantics"
    classification: "ARCHITECTURE_CONTRADICTION"
    action: "STOP and route upward; do not redesign locally"
  - condition: "same-level authority sources conflict"
    classification: "OWNER_CONFLICT"
    action: "record unresolved conflict/BLOCKED; route to owning authority"
  - condition: "required exact-subject CI/Validation/Review evidence missing or stale"
    classification: "MISSING_OR_STALE_EVIDENCE"
    action: "record NOT_RUN/BLOCKED; never infer PASS"
  - condition: "unresolved P0/P1 exists"
    classification: "CLOSURE_INPUT_BLOCKED"
    action: "preserve finding and block affected Closure input"
  - condition: "T06 evidence dimension was not actually executed"
    classification: "DOGFOOD_DIMENSION_NOT_RUN"
    action: "retain NOT_RUN; do not generalize from fixture or other executed dimensions"
  - condition: "historical evidence lacks v4.6 fields/records"
    classification: "EXPECTED_COMPATIBILITY"
    action: "preserve historical identity; do not retrofit"
  - condition: "Fast Path omits non-material v4.6 records"
    classification: "ALLOWED_IF_AUTHORIZED"
    action: "accept only if applicable truth/currentness/gates remain satisfied"
  - condition: "closure-input document would state Candidate Freeze, Version Closure, Release Qualification, Release READY or integration authorization"
    classification: "AUTHORITY_OVERREACH"
    action: "reject wording/output and keep evidence-ledger-only boundary"
  - condition: "v4.7 convergence/resolver behavior becomes necessary"
    classification: "OUT_OF_SCOPE_FUTURE_MAJOR"
    action: "record/reroute; do not implement in T08"
