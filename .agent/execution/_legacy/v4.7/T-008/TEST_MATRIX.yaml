task_id: "T08"
subject_policy: "exact-head/tree + current expected integration target/base + Task/pack identity"
scenarios:
  - id: "STATIC-01"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "durable-only reconstruction recovers pinned authority, owners, applicable profiles/overrides, Task/PR/SHA/base, write/side-effect authority, gates, and next action"
    expected: "deterministic logic may PASS; does not prove REAL fresh-session execution"
  - id: "STATIC-02"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "prior chat-only fact is absent and is not required"
    expected: "PASS only when durable authority is sufficient"
  - id: "STATIC-03"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "stale lower-authority memory/chat cannot override current repository/GitHub facts"
    expected: "stale input ignored or fail-closed, never selected as winner"
  - id: "STATIC-04"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "same user/account/transport is not treated as proof of logical independence"
    expected: "no independence PASS derived from transport identity"
  - id: "STATIC-05"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "stale Issue/PR/exact-subject/currentness is detected"
    expected: "BLOCKED/currentness failure rather than silent consumption"
  - id: "COMPOSE-01"
    class: "STATIC_OR_RECONSTRUCTION"
    purpose: "T05 read-routing and T07 semantic-conformance are consumed without owner mutation"
    expected: "current durable composition retained; authority_effect=NONE for dogfood evidence"
  - id: "REAL-01"
    class: "REAL_FRESH_SESSION_REQUIRED"
    purpose: "genuinely fresh logical Agent/session starts without hidden task-chat context, receives durable pointers, resolves live repository/GitHub facts, and reports the exact subject plus next action/blocker"
    expected: "REAL evidence only from an actually executed fresh logical session; otherwise NOT_RUN/BLOCKED"
  - id: "REAL-02"
    class: "REAL_FRESH_SESSION_REQUIRED"
    purpose: "runtime/session capability unavailable"
    expected: "create exact-subject independent Validation handoff; static/reconstruction evidence cannot substitute; REAL claim remains NOT_RUN/BLOCKED"
  - id: "GATE-01"
    class: "EXACT_SUBJECT_GATE"
    purpose: "independent Validation is bound to immutable implementation HEAD/tree and current expected target/base"
    expected: "PASS only for unchanged exact subject"
  - id: "GATE-02"
    class: "EXACT_SUBJECT_GATE"
    purpose: "Fresh Independent Review starts only after exact-subject Validation PASS"
    expected: "genuinely new READ-ONLY reviewer; no inherited/self review; unchanged exact subject"
gate_order:
  - "builder-implementation"
  - "exact-subject-independent-validation"
  - "fresh-independent-review"
  - "controller-currentness-and-merge-authorization"
non_substitution:
  - "CI_PASS != Validation_PASS"
  - "STATIC_OR_RECONSTRUCTION_PASS != REAL_FRESH_SESSION_PASS"
  - "Builder_REAL_evidence != independent_Validation_PASS"
  - "Validation_PASS != Fresh_Independent_Review_PASS"
  - "Task_PASS != Version_Closure_or_Release_PASS"
