task_id: T-011
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: wiring would rewrite sibling semantic owner semantics (beyond stale pin re-binds)
    disposition: OWNER_REWRITE
    action: stop; central lane consumes, never rewrites owners
  - condition: exactly-one-new-default-family accounting cannot be satisfied by the actual outputs
    disposition: FAMILY_ACCOUNTING_CONFLICT
    action: stop and route to Controller/architecture — never force the accounting
  - condition: a re-bind would weaken an assertion (exact-set loosened, identity pin removed)
    disposition: ORACLE_WEAKENING
    action: stop; re-binds change pinned constants only, with provenance
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set (incl. the JIT-committed harness re-bind)
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: required evidence unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
