  - id: K08
    oracle: no second scheduler/claim lifecycle or runtime authority store is introduced; standard sections compose additively with v4.0–v4.8 invariants (§27 hard eligibility etc. untouched)
  - id: K09
    oracle: Frozen Product E/F/G/K/L/M/N acceptance items each bind to an executable oracle with an exact ref
  - id: K10
