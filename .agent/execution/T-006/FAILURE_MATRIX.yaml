task_id: T-006
failure_modes:
  - condition: version/v4.9.0 target or Frozen/Task Pack/L3 authority drifts before Builder mutation
    disposition: BLOCKED_CURRENTNESS
    action: stop and request Controller JIT rebind
  - condition: same-family successor would require breaking v1 validity beyond the compatible extension surface
    disposition: FAMILY_BREAK
    action: stop and route for architecture/rebind — never a silent breaking change
  - condition: recurrence/friction fields would overlap or redefine the existing friction_classification vocabulary
    disposition: ORTHOGONALITY_VIOLATION
    action: stop; document orthogonality instead
  - condition: Builder needs to edit any path outside MANIFEST builder_write_set (incl. read-only v1 owner refs)
    disposition: TASK_PACK_DEFECT
    action: stop and request Controller rebind/amendment
  - condition: compatibility evidence for a claimed dimension is unavailable
    disposition: NOT_RUN_BLOCKED
    action: record with the exact missing capability; never synthetic PASS
