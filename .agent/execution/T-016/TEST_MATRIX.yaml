task: T-016
required:
  - id: positive-evidence
    proves: exact-subject positive capability observation is representable with provenance
  - id: negative-evidence
    proves: negative capability observation is first-class and not discarded
  - id: stale-currentness-negative
    proves: historical evidence cannot become current availability or successor truth
  - id: validation-review-negative
    proves: capability evidence cannot imply current Validation or Review PASS
  - id: score-negative
    proves: bounded evidence layers do not become a universal scalar Agent score
  - id: economic-noninference
    proves: missing comparable measured methodology forbids savings/performance conclusions
  - id: provider-provenance-negative
    proves: provider/model identity is provenance only
  - id: focused-suite
    command: python -B scripts/test_v48_agent_capability_evidence.py
  - id: protocol-regression
    command: python -B scripts/test_protocol_schemas.py
  - id: repository-verifier
    command: python -B scripts/verify_standard.py
validation: independent schema/currentness/non-inference validation on final exact PR HEAD
review: fresh exact-HEAD review required after validation
