# V410-T08A R1 test matrix — all commands from repo root on the exact candidate
#
# Oracle binding: false-green oracle F1-F12 from #864@6043181240 (implemented as
# record-model mutants in scripts/test_v410_t08a_integration_runner.py and as
# structural guards in scripts/run_v410_integration.py); runner order + result
# record fields + merge-drain/currentness rules from #864@6040893503 (dryrun,
# rebound at this JIT to base 402bf289 / tree 2af7450f — the #861/#862/#863
# suites are inserted into TIER-2 by dependency order per the dryrun insertion
# rule); INT-P/INT-N composition cases from #864@6016404606 and RC/TS/MR checks
