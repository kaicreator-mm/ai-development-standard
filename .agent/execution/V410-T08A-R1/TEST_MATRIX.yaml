# and the false-green mutants; carried suites prove the composed candidate.

matrix:
  - id: T-t08a-focus
    command: python scripts/test_v410_t08a_integration_runner.py
    status: NEW (runner inventory binding + false-green record-model mutants + three-registry agreement + pack surface)
    expect: PASS
    covers: [inventory exact subject binding (base_sha 402bf2899a7e1cd43eea3e7d78a37c947fe28c46 / base_tree 2af7450ff8312bd8652742996071252c42abe65e) and predecessor chain 0518202c -> cea2e0cc -> 402bf289;
             F2 missing/duplicate/unregistered suite row rejected (a required suite that disappears can never aggregate green);
             F4 dirty pre-run tree / tree-mutating command / post-validation source modification rejected;
             F5 mixed head/tree evidence and row-subject mismatch rejected;
             F8 missing or altered disclaimer rejected — "VISIBLE INTEGRATION PASS IS NOT HIDDEN VALIDATION OR RELEASE QUALIFICATION PASS" is mandatory verbatim, hidden_validation/release_qualification/candidate_freeze verdicts structurally NOT_CLAIMED;
             F9 zero-collected / unknown-count / NOT_RUN rows rejected (skipped is never green);
             F10 tested_head and emission head carried separately, deletion rejected;
             F11 evidence_reuse != NONE rejected;
             F7 predecessor-chain drift / unintegrated predecessor rejected;
             F1 stale base binding (sha and tree) rejected;
             F6 FAIL row without owner route rejected, PASS with open routes rejected, unknown defect_class/owner rejected;
             F3 failing cross-suite audit blocks PASS;
             halt/admission consistency (halted PASS rejected, RECORDED admission on FAIL rejected, pending oracle check blocks PASS);
             owner routing classifies each predecessor owner (T06B/T07A/T07B/T06A/T04B/T04A/verify_standard -> CONTROLLER_ARBITRATION);
             three positional registries agree on the single active V410-T08A candidate and the candidate diff stays inside the registered T08A prefixes;
             pack core inventory exact set via v34_rules.core_artifacts_complete;
             runner smoke: --print-inventory binds subject, chain, disclaimer, 20 required commands, stdlib-only]
  - id: T-integration-runner
    command: python scripts/run_v410_integration.py
