dispositions:
  - id: DISP-W11-PLACEMENT
    finding: P3-3
    record: W11 (I1-I6/N13) landed in NEW scripts/test_v410_t06b_core_inventory.py instead of the TEST_MAP-enumerated scripts/test_v34_lifecycle_contracts.py. Not moved post-hoc: the dedicated file is manifest-registered and pinned by the authorized W13 guard set (test_guard_amendment_is_exactly_the_authorized_w13_set); relocating it now would churn a carried v3.4 suite and the registry ledger for zero semantic gain. T-v34-lifecycle is corrected to CARRIED and the delivered placement is pinned by T-t06b-core-inventory.
  - id: DISP-C3-C5-AUTHORITY-RESOLUTION
    finding: P2-3 (partial)
    record: R1-R4 (historical): authorize_non_default enforced only the durable #<issue>@<comment-id> format (C2/C7-format); C3-C5 required durable GitHub fact resolution owned by the admission controller and no local machine model was claimed; the W10 non-default case proved distinct keys only after a syntactically durable ref. R5 (Fresh Review R4 P1-2, #861@6033098161) supersedes the syntax-only acceptance: v34_rules.resolve_non_default_authority makes the W10 keyed admission fail closed unless the ref resolves through the controller-resolved authority_grants inventory (the owner/controller proof path materialized before keyed admission) to a grant of the owning authority family (builder=TASK_PACK, validator=VALIDATION, reviewer=REVIEW_POLICY) applicable to the exact repository+task+role+group tuple. The unrelated Builder-admission ref #861@6023707736 is regression-rejected for validator/windows+linux (AUTHORITY_UNRESOLVED without inventory; AUTHORITY_FAMILY_MISMATCH against a TASK_PACK grant). C3 currentness remains established at the controller boundary that produces the grant inventory; the modeled VALIDATION grant inside the tests is oracle data, not a claim that any real comment authorizes validator/windows+linux on #861 today. R6 (Fresh Review R5 P1-1, #861@6040083891) supersedes the caller-asserted inventory: resolve_non_default_authority now requires the durable owner/controller readback (authority_readback: the owners map from the verified v4.7 registry resolution plus the exact manifest blob subject) and each grant must name an owner_concern resolvable in that readback and carry the matching readback_subject (currentness); self-referencing grant refs fail closed (AUTHORITY_SELF_REFERENCE); a test-internal self-made mapping without the binding manufactures no authority (regression-pinned: AUTHORITY_UNRESOLVED / AUTHORITY_OWNER_UNRESOLVED / AUTHORITY_CURRENTNESS_MISMATCH). The readback re-read remains the controller trust boundary, consistent with scripts/resolve_standard_read_set.py. R7 (Fresh Review R6 P1-1, #861@6044748124) supersedes the grant-content-as-evidence residual: the live GitHub read of #861@6000000000 returned 404, yet the R6 positive C6/H3 oracle still accepted a caller-made grant citing it — the inventory fields alone never proved the referenced durable fact. resolve_non_default_authority now additionally requires the trusted per-ref durable-fact readback (authority_fact_readbacks, materialized by the controller/authority-reader adapter before keyed admission) binding ref identity, existence/currentness (exists; a 404 durable-looking ref fails AUTHORITY_UNRESOLVED), the content-addressed digest of the exact fact content (64-hex content_digest), the owner family, the exact repository/task/role applicability and the explicit authorization content (groups); authorization is derived from that evidence, and authority_grants is demoted to a projection that must equal the fact-derived grant field-by-field (AUTHORITY_GRANT_DRIFT). The positive C6/H3 fixture is anchored to the real resolvable VALIDATION-family durable fact #861@6043191203; #861@6000000000 remains negative-only. The verifier stays purely local — the adapter materialization is the trust boundary, matching TRUST_BOUNDARY in the admitted R7 proposal #861@6044830239. R8 (Fresh Review R7 P1-1, #861@6046779826) supersedes the trusted-projected-fields residual: the R7 positive anchored the real ref #861@6043191203 to a synthetic digest and injected groups its content never granted, so a caller able to supply readback mappings could still manufacture authorization (exists=true + any 64-hex digest + invented groups). resolve_non_default_authority now requires the readback to carry the canonical fact content itself (canonical_content) and RECOMPUTES sha256 over it (mismatch or missing content ⇒ AUTHORITY_DIGEST_MISMATCH — a shape-only 64-hex digest is forbidden), then DERIVES authority_family/repository/task/role/groups by deterministically parsing the fixed-format ai-dev:authority-grant v1 block from that content (v34_rules.parse_authority_grant_block; missing/unterminated/unknown/duplicate/empty-field block ⇒ AUTHORITY_NOT_APPLICABLE fail closed) — no projected field on the readback mapping is ever read. The positive C6/H3 fixture now cites the synthetic oracle grant record #861@6000000001 whose canonical content EXPLICITLY carries the grant block for validator/windows+linux on the exact tuple, honestly labeled fixture/oracle data standing in for an adapter-materialized durable fact; the REAL comment #861@6043191203 is embedded verbatim (byte-exact; sha256 27fe9b90aa26e16b98c3db9d223de685b96324d4733ffd3c6430125760c8151d) as the invented-groups negative: real ref + true content + true digest + R7-style invented groups/grant ⇒ AUTHORITY_NOT_APPLICABLE. All R5/R6/R7 closures, same-work-item projection, default-group short-circuit, H2 multi-active, duplicate-key and CAS invariants are carried unchanged; zero test deletions.
  - id: DISP-G1-G2-G7
    finding: P2-3 (partial)
    record: G1/G2 (environment implies authority) are structurally enforced by the byte-stable profile-role couplings (A11, machine-pinned in T-protocol-schemas and T-t06b-focus) plus environment-never-authority prose (A13/hazard-1 test in this suite); G7/FC9 (verifier PASS vs contradictory owner) is an owner-precedence process rule with no local reducer, and inventing a second authority family is forbidden by the J guards. No dedicated tests claimed.
  - id: DISP-H2-SINGULAR-NULL
    finding: P2-3 (partial)
    record: R1-R4 (historical): H2 was documented-only in the execution-state schema description with no enforcing writer and remained an owner/integration obligation. R5 (Fresh Review R4 P1-3, #861@6033098161) machine-enforces it: a fail-closed allOf conditional in schemas/execution-state.schema.json (active_dispatches minItems 2 => active_dispatch/active_dispatch_role null-or-omitted) plus the v34_rules.execution_state_projection_problems probe with W8 negatives on both surfaces; the same probe adds the #861 rule-2 duplicate-active-key detection (H6) that the schema subset cannot express.
  - id: DISP-SAME-WORK-ITEM-PROJECTION
    finding: P2-1 (R6)
    record: R1-R5 (historical): active_dispatches was documented as this work item's projection, but the positive full-state fixture mixed tasks (#860/#862/#864) and execution_state_projection_problems only compared protected-key strings, so cross-task rows were accepted. R6 (Fresh Review R5 P2-1) machine-enforces same-work-item safety: the probe re-parses each row's protected claim key (v34_rules.parse_claim_key) and requires the derived repository/task to equal the outer execution-state repository/work_item, surfacing ACTIVE_DISPATCH_FOREIGN_WORK_ITEM; the positive fixture is one work item (#861) with distinct roles and cross-task/cross-repository injection negatives are pinned. The schema subset cannot express the row-vs-outer-state check, so the probe is the owned detection surface.
  - id: DISP-D4-SUCCESSOR-RECONCILIATION
    finding: P2-1 (R3 truth correction)
    record: W10 proves terminal transition does not decrement a ClaimCell generation and that stale replay remains stale. It does not model durable reconciliation followed by reservation of a distinct successor dispatch from the latest generation; full D4 successor-reconciliation semantics remain controller/integration evidence and are not claimed by T-execution-architecture.
  - id: DISP-E4-F1-OWNER-SEMANTICS
    finding: P2-1 (R3 truth correction)
    record: W10 proves E3 scheduler-order race determinism plus selected metadata invariance (scheduler_origin/execution_environment/operator/parent/responsibility cannot manufacture a second key). It does not prove the full E4 scheduler-origin-vs-role/capability/authority independence contract, and it does not establish F1 owner semantics. E4/F1 are therefore not claimed by this local test row.

  - id: DISP-D6-CARRIED
    finding: P2-3 (partial)
    record: D6 (BLOCKED_UNSAFE_COMPOSITE_ADMISSION via SAFE_ADMISSION_MODES) remains carried by the v4.8 scheduling conformance suite; T06B claims no new D6 regression.

