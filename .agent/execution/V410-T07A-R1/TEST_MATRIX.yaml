dispositions:
  - id: DISP-NO-CHECKLIST-MUTATION
    record: The optional single pointer line in checklists/version-closure.md ("Candidate / Visible Closure" naming the projection as a closure-consumable input, #862@6013713353 item 3) is JIT-declined: closure consumption does not materially require it — the projection is discoverable at its durable path and the checklist stays byte-stable (blob 6c5616909c07177d13bdba23a589bead5a4e10a0 unchanged).
  - id: DISP-NO-MANIFEST-MUTATION
    record: verify_standard.py requires no registration of docs/implementation or focused-test paths; test_v48_registry_adoption.py RA-guards fail on any unlisted manifest section addition and guard evolution is T06B's authorized W13 mechanism, not this task's. standard-manifest.json stays untouched; the new suite intentionally remains unregistered.
  - id: DISP-SHARED-PRODUCERS
    record: A single fact may support several requirement rows (e.g. test_v410_t06b_multi_dispatch_conformance.py appears under R3/R7/R11 and test_v410_t02b_machine_projection.py under R3/R11), but it is one execution, never counted as multiple independent falsification cases; distinct-case obligations per §19.1 remain owned by the falsification contract and stay UNRESOLVED pending the end-to-end owners (V410-T08A / V410-V01).

negative_invariants:
  - no second Release verdict/state machine (no release-state fields in the record block)
  - no Product requirement redefinition (rows carry prd_ref anchors; meaning stays in the Frozen Product)
  - no historical evidence transfer (old-candidate/preview/predecessor-base identities are rejected bindings, recorded as rejected_provenance)
  - scheduler/CI/Task/PR/Review/Validation/conformance results are never Product acceptance by themselves
  - no NO_GREEN_BY_DELETION: zero carried-suite edits, zero deletions in the diff
  - no merge without fresh Concern Validation + genuinely Fresh Independent Review on one unchanged HEAD/tree
