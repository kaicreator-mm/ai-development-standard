# V410-T07A R1 test matrix — all commands from repo root on the exact candidate
#
# Oracle binding: positive P1-P5 from #862@6003300393; negatives N1-N15 from
# #862@6012768804 plus adversarial attack cases A1-A12 from #862@6043147928;
# ROW_SCHEMA/BLOCKER_RULES from #862@6013713353. The NEW focused suite carries
# the acceptance-map completeness cases and the automatic-transfer negatives;
# carried suites prove the producers the projection binds to actually exist and
# pass on the exact candidate.

matrix:
  - id: T-t07a-focus
    command: python scripts/test_v410_t07a_acceptance_projection.py
    status: NEW (acceptance-map completeness + negative automatic-transfer oracle)
    expect: PASS
    covers: [P1 every active R-row (R1,R2,R3,R4,R6,R7,R11,R12) present exactly once with >=1 durable producer and valid binding class;
             P2 exact candidate/currentness identity — rebind subject 0518202c/75566c46 pinned, every CANDIDATE_BOUND/DURABLE_STATIC producer resolves at the checkout with matching blob, rows carry UNBOUND_UNTIL_T08A_INTEGRATION not an inherited candidate;
             P3 blocker list reconstructible — every row carries blocker_projection in {UNRESOLVED,EVIDENCE_CURRENT}, UNRESOLVED carries missing_evidence_description + route_to_owner, closure_blocker_inputs distinct from requirement rows;
             P4 Minimum/Advanced paths both legal — adoption_path vocabulary, every row constructible with >=1 non-EVENT_BOUND producer (zero scheduler/runtime dependence), no Advanced-only orchestration demoted onto Minimum;
             P5 Release owner external — PROJECTION_ONLY header, no verdict vocabulary, no second release state machine field;
             N1/N2/A1/A5/A10 old-candidate/wrong-subject binding rejected (stale SHA mutant, drifted blob mutant, historical L1 lineage never a current producer, preview heads never candidate identity);
             N3/N5/N10/A2/A3/A9 cross-layer PASS cannot clear blockers (scheduler/conformance PASS producer class cannot yield EVIDENCE_CURRENT on an unbound subject; evidence-ref existence never equals acceptance);
             N8 double-count — duplicate-lane durable_ref dedup enforced;
             N11 missing evidence never NOT_APPLICABLE (empty-producer mutant fails closed);
             N13/A4/A12 verdict vocabulary + index-overreach rejected (PASS/READY/ACCEPTED/NOT_APPLICABLE forbidden in row fields; no freeze-decision field path);
             N15 ADS_CORE_FEATURE_FREEZE_ELIGIBLE unreachable from the index;
             pack core inventory exact-set via owner helper v34_rules.core_artifacts_complete;
             retained prep-branch test file confirmed NOT a candidate (absent at checkout, named in rejected provenance)]
