  - no second Release verdict/state machine (no release-state fields in the record block)
  - no Product requirement redefinition (rows carry prd_ref anchors; meaning stays in the Frozen Product)
  - no historical evidence transfer (old-candidate/preview/predecessor-base identities are rejected bindings, recorded as rejected_provenance)
  - scheduler/CI/Task/PR/Review/Validation/conformance results are never Product acceptance by themselves
  - no NO_GREEN_BY_DELETION: zero deletions in the diff and zero removed tests; the carried-suite edits (scripts/test_v410_owner_convergence.py by the pre-authorized T07B registry rebind; scripts/test_v410_t07a_acceptance_projection.py by the authorized R3 seam rebind; both plus scripts/test_v410_t07b_decision_record.py by the disclosed T08A registry rebind, see t08a_registry_rebind; all five carried suites by the disclosed V410-IDENTITY-R1 registry rebind, see identity_registry_rebind) are recorded in r2_repair_record, r3_seam_rebind, t08a_registry_rebind and identity_registry_rebind
